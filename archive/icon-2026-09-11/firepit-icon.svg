<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Firepit">
  <title>Firepit</title>
  <!-- Full bleed and square: every OS masks it differently, so the shape is
       theirs to choose. Artwork sits inside the 336px circle Android adaptive
       icons guarantee, so nothing is clipped by a round or squircle mask. -->
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2611A"/>
      <stop offset="1" stop-color="#A8350A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ember)"/>

  <!-- Flame and its hollow in one path: evenodd lets the background burn
       through the middle, so the mark is two fills and no seams. The smaller
       tongue on the left is what separates fire from a falling drop. -->
  <path fill="#FFF4EC" fill-rule="evenodd" d="
    M 262 122
    C 306 174 336 216 336 268
    C 336 320 300 356 256 356
    C 212 356 176 320 176 270
    C 176 236 192 206 216 182
    C 214 214 222 238 240 252
    C 258 224 266 172 262 122
    Z
    M 256 248
    C 276 274 291 289 291 311
    C 291 332 276 344 256 344
    C 236 344 221 332 221 311
    C 221 289 236 274 256 248
    Z"/>

  <!-- The pit: a rim, not a bowl. Enough to say the fire is kept. -->
  <path d="M 170 384 Q 256 416 342 384" fill="none" stroke="#FFF4EC"
        stroke-width="22" stroke-linecap="round" opacity="0.9"/>
</svg>
